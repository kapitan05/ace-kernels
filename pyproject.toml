[project]
name = "ace-kernels"
version = "0.1.0"
description = "Optimized PyTorch/Triton implementations of the mL1-ACE calibration loss"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "monai>=1.6.1",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "wandb>=0.31.0",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "kaggle>=2.2.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.build-backend]
module-name = ["ace_kernels", "ace_bench", "ace_reference"]

[tool.ruff]
line-length = 88
# Only our code: never lint/format other checkouts placed in the repo dir.
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
extend-exclude = ["src/ace_reference/hardl1ace.py", "src/ace_reference/softl1ace.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/ace_kernels", "src/ace_bench", "tests", "scripts"]
exclude = ["src/ace_reference/"]

[[tool.mypy.overrides]]
module = ["ace_reference", "ace_reference.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# torch's CUDA event/stream/NVTX/profiler-control APIs ship without annotations
module = ["ace_bench.*", "tests.test_sync"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["monai.*", "triton", "triton.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: needs a CUDA GPU"]
