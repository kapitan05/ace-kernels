[project]
name = "ace-kernels"
version = "0.1.0"
description = "Optimized PyTorch/Triton implementations of the mL1-ACE calibration loss"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "monai>=1.6.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.8",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.uv.build-backend]
module-name = ["ace_kernels", "ace_reference"]

[tool.ruff]
line-length = 88
extend-exclude = ["src/ace_reference/hardl1ace.py", "src/ace_reference/softl1ace.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src/ace_kernels", "tests", "scripts"]
exclude = ["src/ace_reference/"]

[[tool.mypy.overrides]]
module = ["ace_reference", "ace_reference.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["monai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["cuda: needs a CUDA GPU"]
