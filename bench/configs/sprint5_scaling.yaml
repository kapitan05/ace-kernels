# Sprint 5: % of peak bandwidth vs volume for the Triton forward.
name: sprint5-scaling
group: sprint5-triton-fwd
hypothesis: >-
  v3_triton's forward reaches a roughly constant, high fraction of peak bandwidth
  once the grid fills the GPU (>= 64^3); PyTorch versions stay below 5%.
device: cuda
impls: [v1_clean_compile, v2_recompute, v3_triton]
binnings: [hard]
modes: [fwd, fwd_bwd]
warmup: 3
reps: 10
shapes:
  - {name: cube32, batch: 2, channels: 4, spatial: [32, 32, 32]}
  - {name: cube64, batch: 2, channels: 4, spatial: [64, 64, 64]}
  - {name: cube96, batch: 2, channels: 4, spatial: [96, 96, 96]}
  - {name: cube128, batch: 2, channels: 4, spatial: [128, 128, 128]}
  - {name: cube160, batch: 2, channels: 4, spatial: [160, 160, 160]}
  - {name: cube192, batch: 2, channels: 4, spatial: [192, 192, 192]}
