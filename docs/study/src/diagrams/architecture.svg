<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, sans-serif" font-size="13" role="img" aria-label="Architecture of the repository">
<style>
.b{fill:var(--surface);stroke:var(--line);stroke-width:1.5;rx:8}
.k{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.t{fill:var(--ink)} .s{fill:var(--ink-2);font-size:11px} .h{fill:var(--ink);font-weight:700}
.a{stroke:var(--muted);stroke-width:1.5;fill:none;marker-end:url(#ar)}
</style>
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="var(--muted)"/></marker></defs>
<rect class="b" x="20" y="20" width="250" height="70" rx="8"/><text class="h" x="35" y="45">ace_reference/</text><text class="s" x="35" y="65">upstream loss, frozen (SHA test)</text><text class="s" x="35" y="80">= ground truth</text>
<rect class="b" x="20" y="120" width="250" height="110" rx="8"/><text class="h" x="35" y="145">ace_kernels/ core</text><text class="s" x="35" y="165">config.py   ACEConfig (all options)</text><text class="s" x="35" y="182">common.py   prepare, edges, reduce</text><text class="s" x="35" y="199">binning.py  BinStats math (torch)</text><text class="s" x="35" y="216">registry.py name -> implementation</text>
<rect class="k" x="310" y="20" width="270" height="210" rx="8"/><text class="h" x="325" y="45">impls/  the ladder (1 change each)</text>
<text class="s" x="325" y="68">reference, baselines (compile, ckpt)   S2</text><text class="s" x="325" y="88">v1_vectorized -> v1_clean              S3</text><text class="s" x="325" y="108">v2_autograd (handwritten bwd)         S4</text><text class="s" x="325" y="128">v3_triton -> v4_triton             S5-S7</text><text class="s" x="325" y="148">v5_triton (fused softmax)             S8</text><text class="s" x="325" y="168">v6_index -> v6_triton -> v6_precise  S11</text><text class="s" x="325" y="188">v6_dot (side branch, tensor cores)  S11</text><text class="s" x="325" y="214">all call into kernels/ (v3+)</text>
<rect class="k" x="620" y="20" width="260" height="210" rx="8"/><text class="h" x="635" y="45">kernels/  Triton (GPU)</text><text class="s" x="635" y="68">act.py        softmax / exp in registers</text><text class="s" x="635" y="88">bins.py       O(1) index, dot reduction</text><text class="s" x="635" y="108">hard_hist.py  private histograms</text><text class="s" x="635" y="128">soft_hist.py  2-bin interpolation</text><text class="s" x="635" y="148">hard_bwd.py   gradient in 1 pass</text><text class="s" x="635" y="168">soft_bwd.py   gradient in 1 pass</text><text class="s" x="635" y="188">epilogue.py   per-bin -> loss, 1 launch</text>
<rect class="k" x="310" y="260" width="270" height="60" rx="8"/><text class="h" x="325" y="285">module.py  (the deliverable)</text><text class="s" x="325" y="305">HardL1ACELoss / SoftL1ACELoss drop-ins</text>
<rect class="b" x="20" y="260" width="250" height="150" rx="8"/><text class="h" x="35" y="285">tests/</text><text class="s" x="35" y="305">golden, oracle (float64), equivalence</text><text class="s" x="35" y="322">v2 (gradcheck), triton, module</text><text class="s" x="35" y="339">sync / CUDA graphs, saved tensors</text><text class="s" x="35" y="356">study (this guide)</text><text class="s" x="35" y="385">gate: must pass before any benchmark</text>
<rect class="b" x="620" y="260" width="260" height="150" rx="8"/><text class="h" x="635" y="285">ace_bench/  measurement</text><text class="s" x="635" y="305">run / measure / timing / calculator</text><text class="s" x="635" y="322">profile, e2e (training), ablation</text><text class="s" x="635" y="339">remote (Kaggle), tracking (W&amp;B)</text><text class="s" x="635" y="356">report, figures, study</text><text class="s" x="635" y="385">-> results/, docs/, W&amp;B</text>
<path class="a" d="M270,55 H305"/><path class="a" d="M270,175 H305"/><path class="a" d="M580,125 H615"/><path class="a" d="M445,230 V255"/><path class="a" d="M145,255 V235"/><path class="a" d="M750,255 V235"/>
</svg>
